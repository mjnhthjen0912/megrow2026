<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./themes.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet" />
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#1b2a20;background:#f7faf4}
a{color:#2f6b45}
a:hover{color:#1f4d31}
</style>
</helmet>
<div style="display:flex;height:100vh;flex-direction:{{ dir }}">
<sc-if value="{{ isBar }}" hint-placeholder-val="{{ true }}">
<header style="flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;height:52px;position:relative;z-index:5;background:{{ hdrBg }};border-bottom:1px solid {{ c.line }};color:{{ c.ink }}">
<span style="flex:none;font-family:Newsreader,serif;font-weight:600;font-size:17px">me.grow 2026</span>
<span style="flex:none;width:1px;height:22px;background:{{ c.line }}"></span>
<button onClick="{{ prev }}" aria-label="Chủ đề trước" style="flex:none;width:34px;height:34px;font:inherit;font-size:14px;cursor:pointer;border:1px solid {{ c.btnLine }};background:{{ c.btn }};color:{{ c.ink }}">←</button>
<button onClick="{{ toggle }}" style="flex:1;min-width:0;max-width:640px;height:34px;display:flex;align-items:center;gap:10px;padding:0 12px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left;border:1px solid {{ c.btnLine }};background:{{ c.field }};color:{{ c.ink }}">
<span style="flex:none;font-size:11px;font-weight:700;letter-spacing:.08em;color:{{ c.accent }}">{{ topicWord }} {{ cur.n }}</span>
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ cur.title }}</span>
<span style="flex:none;font-size:11px;color:{{ c.mute }}">▾</span>
</button>
<button onClick="{{ next }}" aria-label="Chủ đề tiếp" style="flex:none;width:34px;height:34px;font:inherit;font-size:14px;cursor:pointer;border:1px solid {{ c.btnLine }};background:{{ c.btn }};color:{{ c.ink }}">→</button>
<span style="flex:none;font-size:12px;font-variant-numeric:tabular-nums;color:{{ c.mute }}">{{ pos }}</span>
<span style="flex:1;min-width:0"></span>
<span style="flex:none;display:flex;align-items:center;padding:5pt;background:rgba(255,255,255,.38);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);border-radius:6px"><img src="assets/rmit-zalo3-color.png" alt="RMIT University × Zalo" style="flex:none;height:26px;width:auto;display:block"></span>
<span style="flex:none;display:flex;height:26px;box-sizing:border-box;border:1px solid {{ c.btnLine }};border-radius:13px;overflow:hidden;font-size:11px;font-weight:600;letter-spacing:.02em"><button onClick="{{ setEn }}" aria-pressed="{{ isEn }}" title="Chỉ tiếng Anh" style="padding:0 9px;border:0;cursor:pointer;font:inherit;color:{{ c.ink }};background:{{ enBg }}">EN</button><button onClick="{{ setBi }}" aria-pressed="{{ isBi }}" title="Song ngữ Anh – Việt" style="padding:0 9px;border:0;border-left:1px solid {{ c.btnLine }};cursor:pointer;font:inherit;color:{{ c.ink }};background:{{ biBg }}">EN/VI</button></span>
<button onClick="{{ toggleTone }}" aria-label="Đổi tone màu" title="Tone màu: {{ toneLabel }}" style="flex:none;display:flex;align-items:center;gap:6px;height:26px;box-sizing:border-box;padding:0 9px 0 4px;border-radius:13px;cursor:pointer;border:1px solid {{ c.btnLine }};background:{{ c.btn }};color:{{ c.ink }};font:inherit;font-size:11px;font-weight:600;letter-spacing:.02em"><span style="flex:none;width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.25);background:{{ toneDot }}"></span><span>Tone</span><span style="font-size:9px;opacity:.7">▾</span></button>
</header>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ close }}" style="position:fixed;inset:52px 0 0 0;background:rgba(23,22,20,.18);z-index:4"></div>
<div style="position:absolute;top:52px;left:16px;right:16px;max-width:760px;max-height:calc(100vh - 80px);overflow-y:auto;background:{{ dd.page }};border:1px solid {{ dd.line }};box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:6;padding:8px">
<sc-for list="{{ topics }}" as="t" hint-placeholder-count="15">
<button onClick="{{ t.pick }}" style="display:flex;align-items:baseline;gap:14px;width:100%;padding:10px 12px;border:0;border-left:2px solid transparent;font:inherit;text-align:left;cursor:pointer;background:{{ t.bg }};border-left-color:{{ t.bar }}" style-hover="background:{{ dd.aside }}">
<span style="flex:none;width:26px;font-size:12px;font-weight:700;color:{{ dd.ac }};font-variant-numeric:tabular-nums">{{ t.num }}</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:14px;color:#1b2a20;font-weight:{{ t.fw }}">{{ t.title }}</span>
<span style="font-size:12px;color:#68786b">{{ t.sub }}</span>
</span>
</button>
</sc-for>
</div>
</sc-if>
</sc-if>
<sc-if value="{{ isRail }}" hint-placeholder-val="{{ false }}">
<aside style="flex:none;width:260px;display:flex;flex-direction:column;background:{{ hdrBg }};border-right:1px solid {{ c.line }};color:{{ c.ink }}">
<div style="padding:18px 18px 12px;display:flex;flex-direction:column;gap:10px">
<span style="font-family:Newsreader,serif;font-weight:600;font-size:18px">me.grow 2026</span>
<div style="display:flex"><button onClick="{{ toggleTone }}" aria-label="Đổi tone màu" title="Tone màu: {{ toneLabel }}" style="flex:none;display:flex;align-items:center;gap:6px;height:26px;box-sizing:border-box;padding:0 9px 0 4px;border-radius:13px;cursor:pointer;border:1px solid {{ c.btnLine }};background:{{ c.btn }};color:{{ c.ink }};font:inherit;font-size:11px;font-weight:600;letter-spacing:.02em"><span style="flex:none;width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.25);background:{{ toneDot }}"></span><span>Tone</span><span style="font-size:9px;opacity:.7">▾</span></button></div>
</div>
<nav style="flex:1;min-height:0;overflow-y:auto;padding:0 8px 20px;display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ topics }}" as="t" hint-placeholder-count="15">
<button onClick="{{ t.pick }}" style="display:flex;align-items:baseline;gap:10px;width:100%;padding:8px 10px;border:0;border-left:2px solid transparent;font:inherit;text-align:left;cursor:pointer;background:{{ t.rbg }};border-left-color:{{ t.rbar }}">
<span style="flex:none;width:20px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:{{ c.accent }}">{{ t.num }}</span>
<span style="flex:1;min-width:0;font-size:13px;line-height:1.4;color:{{ t.rink }};font-weight:{{ t.fw }}">{{ t.title }}</span>
</button>
</sc-for>
</nav>
<div style="flex:none;padding:14px 18px;border-top:1px solid {{ c.line }}"><span style="flex:none;display:flex;align-items:center;padding:5pt;background:rgba(255,255,255,.38);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);border-radius:6px;justify-content:center"><img src="assets/rmit-zalo3-color.png" alt="RMIT University × Zalo" style="max-width:100%;height:auto;display:block"></span></div>
</aside>
</sc-if>
<sc-if value="{{ isTabs }}" hint-placeholder-val="{{ false }}">
<header style="flex:none;display:flex;align-items:stretch;gap:0;background:{{ hdrBg }};border-bottom:1px solid {{ c.line }};color:{{ c.ink }}">
<span style="flex:none;display:flex;align-items:center;padding:0 16px;font-family:Newsreader,serif;font-weight:600;font-size:16px;border-right:1px solid {{ c.line }}">me.grow 2026</span>
<div style="flex:1;min-width:0;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:{{ c.btnLine }} transparent">
<sc-for list="{{ topics }}" as="t" hint-placeholder-count="15">
<button onClick="{{ t.pick }}" title="{{ t.title }}" style="flex:none;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:0;border-bottom:2px solid transparent;font:inherit;font-size:12.5px;cursor:pointer;background:transparent;border-bottom-color:{{ t.rbar }};color:{{ t.rink }};font-weight:{{ t.fw }}">
<span style="font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:{{ c.accent }}">{{ t.num }}</span>
<span style="white-space:nowrap">{{ t.short }}</span>
</button>
</sc-for>
</div>
<span style="flex:none;display:flex;align-items:center;padding:0 16px;border-left:1px solid {{ c.line }}"><span style="flex:none;display:flex;align-items:center;padding:5pt;background:rgba(255,255,255,.38);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);border-radius:6px"><img src="assets/rmit-zalo3-color.png" alt="RMIT University × Zalo" style="flex:none;height:24px;width:auto;display:block"></span></span>
<span style="flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 0"><span style="flex:none;display:flex;height:26px;box-sizing:border-box;border:1px solid {{ c.btnLine }};border-radius:13px;overflow:hidden;font-size:11px;font-weight:600;letter-spacing:.02em"><button onClick="{{ setEn }}" aria-pressed="{{ isEn }}" title="Chỉ tiếng Anh" style="padding:0 9px;border:0;cursor:pointer;font:inherit;color:{{ c.ink }};background:{{ enBg }}">EN</button><button onClick="{{ setBi }}" aria-pressed="{{ isBi }}" title="Song ngữ Anh – Việt" style="padding:0 9px;border:0;border-left:1px solid {{ c.btnLine }};cursor:pointer;font:inherit;color:{{ c.ink }};background:{{ biBg }}">EN/VI</button></span><button onClick="{{ toggleTone }}" aria-label="Đổi tone màu" title="Tone màu: {{ toneLabel }}" style="flex:none;display:flex;align-items:center;gap:6px;height:26px;box-sizing:border-box;padding:0 9px 0 4px;border-radius:13px;cursor:pointer;border:1px solid {{ c.btnLine }};background:{{ c.btn }};color:{{ c.ink }};font:inherit;font-size:11px;font-weight:600;letter-spacing:.02em"><span style="flex:none;width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.25);background:{{ toneDot }}"></span><span>Tone</span><span style="font-size:9px;opacity:.7">▾</span></button></span>
</header>
</sc-if>
<sc-if value="{{ toneOpen }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeTone }}" style="position:fixed;inset:0;z-index:7"></div>
<div style="position:fixed;top:{{ tonePos.top }};right:{{ tonePos.right }};left:{{ tonePos.left }};width:220px;max-height:calc(100vh - 80px);overflow-y:auto;background:#fff;border:1px solid {{ dd.line }};box-shadow:0 8px 30px rgba(0,0,0,.14);z-index:8;padding:6px;display:flex;flex-direction:column;gap:2px">
<span style="padding:6px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;color:#68786b">TONE MÀU</span>
<sc-for list="{{ tones }}" as="t" hint-placeholder-count="13">
<button onClick="{{ t.pick }}" style="display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;font:inherit;font-size:13.5px;text-align:left;cursor:pointer;color:#1b2a20;background:{{ t.bg }};font-weight:{{ t.fw }}" style-hover="background:{{ dd.aside }}">
<span style="flex:none;width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12);background:{{ t.sw }}"></span>
<span style="flex:1;min-width:0">{{ t.name }}</span>
<span style="flex:none;font-size:12px;color:{{ dd.ac }}">{{ t.mark }}</span>
</button>
</sc-for>
</div>
</sc-if>
<iframe src="{{ frameSrc }}" title="{{ cur.en }}" style="flex:1;min-width:0;min-height:0;width:100%;border:0;display:block"></iframe>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;navStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Thanh trên&quot;,&quot;Cột bên&quot;,&quot;Dải thẻ&quot;],&quot;default&quot;:&quot;Thanh trên&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Điều hướng&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Rừng&quot;,&quot;Rêu&quot;,&quot;Sương mù&quot;,&quot;Thung lũng&quot;,&quot;Biển&quot;,&quot;Hoàng hôn&quot;,&quot;Anh đào&quot;,&quot;Đêm sao&quot;,&quot;Sa mạc&quot;,&quot;Nắng xuân&quot;,&quot;Sáng&quot;,&quot;Giấy&quot;,&quot;Mực&quot;,&quot;Zalo&quot;],&quot;default&quot;:&quot;Zalo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Không khí&quot;},&quot;titleLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Tiếng Việt&quot;,&quot;English&quot;],&quot;default&quot;:&quot;English&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Điều hướng&quot;}}">
const T = [
['Topic 1 - Leadership Transition - EN-VI.dc.html','Điều hướng bước chuyển sang vai trò quản lý','Leadership Transition'],
['Topic 2 - Operational Execution - EN-VI.dc.html','Thúc đẩy triển khai vận hành','Operational Execution'],
['Topic 3 - Audit Mindset and Biases - EN-VI.dc.html','Tư duy kiểm toán & thiên kiến','Audit Mindset and Biases'],
['Topic 4 - Practise Performance Conversations - EN-VI.dc.html','Thực hành trao đổi hiệu suất với khung AMO','Practise Performance Conversations'],
['Topic 5 - Optimise Personal Productivity - EN-VI.dc.html','Tối ưu năng suất cá nhân','Optimise Personal Productivity'],
['Topic 6 - Delegation and Accountability - EN-VI.dc.html','Giao việc và trách nhiệm giải trình trong đội ngũ vận hành tốc độ cao','Delegation and Accountability'],
['Topic 7 - Building Team Capability and Growth - EN-VI.dc.html','Xây dựng năng lực và sự phát triển của đội ngũ','Building Team Capability and Growth'],
['Topic 8 - Correcting Behaviour Through Coaching - EN-VI.dc.html','Điều chỉnh hành vi thông qua coaching','Correcting Behaviour Through Coaching'],
['Topic 9 - Coaching for High Performance - EN-VI.dc.html','Coaching để đạt hiệu suất cao','Coaching for High Performance'],
['Topic 10 - Adapt Your Leadership Style - EN-VI.dc.html','Điều chỉnh phong cách lãnh đạo','Adapt Your Leadership Style'],
['Topic 11 - Customise Approach for Individuals - EN-VI.dc.html','Cách tiếp cận phù hợp với từng cá nhân','Customise Approach for Individuals'],
['Topic 12 - Stakeholder Influence - Leadership in Technology - EN-VI.dc.html','Ảnh hưởng đến các bên liên quan & Lãnh đạo trong lĩnh vực công nghệ','Stakeholder Influence – Leadership in Technology'],
['Topic 13 - Building Trust and Open Communication - EN-VI.dc.html','Xây dựng niềm tin & giao tiếp cởi mở trong đội nhóm','Building Trust and Open Communication'],
['Topic 14 - Creating Alignment for High-Performing Teams - EN-VI.dc.html','Tạo sự đồng thuận cho đội nhóm hiệu suất cao','Creating Alignment for High-Performing Teams'],
  ['Topic 15 - From Stakeholder Insight to Market Impact - EN-VI.dc.html','Từ thấu hiểu các bên liên quan đến tác động thị trường','From Stakeholder Insight to Market Impact']
].map((t, i) => ({ n: i + 1, src: './' + encodeURI(t[0]), vi: t[1], en: t[2] }));
const TONES = {
  'Rừng': { bg: '#3a5e47', line: '#4a6f57', ink: '#f2f7f0', mute: '#c3d8c6', btn: '#44694f', btnLine: '#5a7f65', field: '#44694f', accent: '#cdeccf', sel: '#4b7258', dim: '#e2eee2' },
  'Rêu': { bg: '#e9f1e5', line: '#d0dfcc', ink: '#1b2a20', mute: '#68786b', btn: '#f6faf3', btnLine: '#c0d2bd', field: '#f6faf3', accent: '#2f6b45', sel: '#d6e6d0', dim: '#2f3d33' },
  'Sáng': { bg: '#ffffff', line: '#dae4d6', ink: '#1b2a20', mute: '#68786b', btn: '#ffffff', btnLine: '#c4d2c1', field: '#f0f5ec', accent: '#2f6b45', sel: '#e0ebda', dim: '#2f3d33' },
  'Giấy': { bg: '#f3efe4', line: '#ddd6c4', ink: '#2a251c', mute: '#857c69', btn: '#faf7ef', btnLine: '#cfc6b0', field: '#faf7ef', accent: '#7a5a2e', sel: '#e6dfcd', dim: '#4a4335' },
  'Mực': { bg: '#1c2328', line: '#2f3a42', ink: '#eef0f1', mute: '#9aa6ae', btn: '#252e34', btnLine: '#3a4750', field: '#252e34', accent: '#9cc3d8', sel: '#2a353d', dim: '#c3cbd0' }
};
class Component extends DCLogic {
  state = { i: this.initial(), open: false, toneOpen: false, tone: localStorage.getItem('lt-tone-v2'), lang: localStorage.getItem('lt-lang') || 'bi' };
  initial() {
    const h = parseInt((location.hash.match(/topic-(\d+)/) || [])[1]);
    if (h >= 1 && h <= T.length) return h - 1;
    const s = parseInt(localStorage.getItem('lt-topic'));
    return s >= 0 && s < T.length ? s : 0;
  }
  componentDidMount() {
    if (!window.LT_THEMES) { const iv = setInterval(() => { if (window.LT_THEMES) { clearInterval(iv); this.forceUpdate(); } }, 60); setTimeout(() => clearInterval(iv), 8000); }
    this._k = (e) => { if (e.key === 'Escape') this.setState({ open: false, toneOpen: false }); };
    this._h = () => { const h = parseInt((location.hash.match(/topic-(\d+)/) || [])[1]); if (h >= 1 && h <= T.length && h - 1 !== this.state.i) this.setState({ i: h - 1 }); };
    window.addEventListener('keydown', this._k);
    window.addEventListener('hashchange', this._h);
  }
  componentDidUpdate(pp) { if (pp.tone !== this.props.tone && pp.tone !== undefined) { localStorage.removeItem('lt-tone-v2'); this.setState({ tone: null }); } }
  setTone(n) { localStorage.setItem('lt-tone-v2', n); this.setState({ tone: n, toneOpen: false }); }
  componentWillUnmount() { window.removeEventListener('keydown', this._k); window.removeEventListener('hashchange', this._h); }
  go(i) {
    i = (i + T.length) % T.length;
    localStorage.setItem('lt-topic', String(i));
    history.replaceState(null, '', '#topic-' + (i + 1));
    this.setState({ i, open: false });
  }
  renderVals() {
    const i = this.state.i;
    const nav = this.props.navStyle ?? 'Thanh trên';
    const TONE_LIST = ['Rừng','Rêu','Sương mù','Thung lũng','Biển','Hoàng hôn','Anh đào','Đêm sao','Sa mạc','Nắng xuân','Sáng','Giấy','Mực','Zalo'];
    const st = TONE_LIST.includes(this.state.tone) ? this.state.tone : null;
    const toneName = st ?? this.props.tone ?? 'Zalo';
    const swatch = (n) => { const X = (window.LT_THEMES || {})[n]; return X && window.LT_header ? window.LT_header(X) : ((TONES[n] || {}).bg || '#ccc'); };
    const TH = (window.LT_THEMES || {})[toneName];
    const c = TH ? TH.bar : (TONES[toneName] || TONES['Rừng']);
    const en = (this.props.titleLang ?? 'Tiếng Việt') === 'English';
    const dd = TH ? { sel: TH.sel, ac: TH.accent, page: TH.page, aside: TH.aside, line: TH.sel } : { sel: '#e0ebda', ac: '#2f6b45', page: '#fff', aside: '#e9f1e5', line: '#c4d2c1' };
    const map = (t, k) => {
      const on = k === i;
      return { ...t, num: String(t.n).padStart(2, '0'), title: en ? t.en : t.vi, sub: en ? t.vi : t.en,
        short: (en ? t.en : t.vi).split(/ [–&-] | và | for | trong /)[0],
        bg: on ? dd.sel : 'transparent', bar: on ? dd.ac : 'transparent', fw: on ? '600' : '400',
        rbg: on ? c.sel : 'transparent', rbar: on ? c.accent : 'transparent', rink: on ? c.ink : c.dim,
        pick: () => this.go(k) };
    };
    const topics = T.map(map);
    return {
      cur: topics[i], frameSrc: topics[i].src + '?tone=' + encodeURIComponent(TH ? toneName : 'Rừng') + (this.state.lang === 'en' ? '&lang=en' : ''),
      isEn: this.state.lang === 'en', isBi: this.state.lang !== 'en', enBg: this.state.lang === 'en' ? c.sel : 'transparent', biBg: this.state.lang !== 'en' ? c.sel : 'transparent',
      setEn: () => { localStorage.setItem('lt-lang', 'en'); this.setState({ lang: 'en' }); }, setBi: () => { localStorage.setItem('lt-lang', 'bi'); this.setState({ lang: 'bi' }); }, hdrBg: TH && window.LT_header ? window.LT_header(TH) : c.bg, pos: (i + 1) + ' / ' + T.length, open: this.state.open, topics, c, dd,
      topicWord: en ? 'TOPIC' : 'CHỦ ĐỀ',
      toneLabel: toneName, toneSwatch: swatch(toneName), toneDot: 'linear-gradient(135deg,' + (TH ? TH.accent : c.accent) + ' 50%,' + (TH ? TH.page : '#f7faf4') + ' 50%)', toneOpen: this.state.toneOpen,
      tonePos: nav === 'Cột bên' ? { top: '96px', left: '18px', right: 'auto' } : { top: (nav === 'Dải thẻ' ? '50px' : '56px'), right: '16px', left: 'auto' },
      tones: TONE_LIST.map(n => ({ name: n, sw: swatch(n), on: n === toneName, bg: n === toneName ? dd.sel : 'transparent', fw: n === toneName ? '600' : '400', mark: n === toneName ? '✓' : '', pick: () => this.setTone(n) })),
      toggleTone: () => this.setState({ toneOpen: !this.state.toneOpen, open: false }), closeTone: () => this.setState({ toneOpen: false }),
      logoFilter: (() => { const m = /^#?([0-9a-f]{6})$/i.exec(c.ink || ''); if (!m) return 'none'; const n = parseInt(m[1], 16); const L = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)); return L > 150 ? 'brightness(0) invert(1)' : 'none'; })(),
      logoReverse: ((() => { const m = /^#?([0-9a-f]{6})$/i.exec(c.ink || ''); if (!m) return false; const n = parseInt(m[1], 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 150; })()),
      logoColor: !((() => { const m = /^#?([0-9a-f]{6})$/i.exec(c.ink || ''); if (!m) return false; const n = parseInt(m[1], 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 150; })()),
      _oldLogo: 'assets/rmit-zalo2' + ((() => { const m = /^#?([0-9a-f]{6})$/i.exec(c.ink || ''); if (!m) return '-color'; const n = parseInt(m[1], 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 150 ? '-reverse' : '-color'; })()) + '.png',
      isBar: nav === 'Thanh trên', isRail: nav === 'Cột bên', isTabs: nav === 'Dải thẻ',
      dir: nav === 'Cột bên' ? 'row' : 'column',
      prev: () => this.go(i - 1), next: () => this.go(i + 1),
      toggle: () => this.setState({ open: !this.state.open, toneOpen: false }), close: () => this.setState({ open: false })
    };
  }
}
